name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar código, testes e build
        run: npm run check

      - name: Publicar build como artefato
        uses: actions/upload-artifact@v4
        with:
          name: assistente-conhecimento-web
          path: dist
          if-no-files-found: error
